name: contracts

on:
  pull_request:
  push:
    branches: [main]

# Every job here only reads the checkout. Without this the token carries the
# repository default into six third-party actions.
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: axioma/api/pnpm-lock.yaml
      - run: pnpm --dir api install --frozen-lockfile
      - run: pnpm --dir api contracts:check

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: node scripts/publish-ui.mjs --check

  helm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4
      - run: pwsh ./scripts/verify-chart.ps1

  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://axioma_test:axioma_test_password@localhost:5432/axioma_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-characters-minimum
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001
      NODE_ENV: test
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: axioma_test
          POSTGRES_USER: axioma_test
          POSTGRES_PASSWORD: axioma_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axioma_test -d axioma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: axioma/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: axioma/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check-types
      - run: pnpm db:migrate
      # A migration whose snapshot was never refreshed passes db:migrate and
      # breaks the next db:generate. This is what catches it.
      - run: pnpm db:check
      - run: pnpm test
      - run: pnpm build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.28
          enable-cache: true
          cache-dependency-glob: axioma/agent/uv.lock
      - run: uv sync --all-extras --frozen
      - run: bash scripts/generate-proto.sh
      - run: uv run ruff check axel tests
      - run: uv run pytest

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.6
          cache-dependency-path: axioma/cli/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.28
      - run: pwsh scripts/generate-proto.ps1
      - run: git diff --exit-code -- internal/pb
      - run: "test -z \"$(gofmt -l ./internal ./cmd)\""
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  windows-agent-cli:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.28
          enable-cache: true
          cache-dependency-glob: axioma/agent/uv.lock
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.6
          cache-dependency-path: axioma/cli/go.sum
      - working-directory: axioma/agent
        run: uv sync --all-extras --frozen
      - working-directory: axioma/agent
        run: uv run ruff check axel tests
      - working-directory: axioma/agent
        run: uv run pytest -q --basetemp .pytest-tmp
      - working-directory: axioma/cli
        run: pwsh scripts/generate-proto.ps1
      - working-directory: axioma/cli
        run: go test ./...
      - working-directory: axioma/cli
        run: go vet ./...
      - working-directory: axioma/cli
        run: go build ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: axioma/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm validate
      # Vite generates routeTree.gen.ts before TypeScript consumes it.
      - run: pnpm build
      - run: pnpm check-types

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma/portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: axioma/portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm validate
      # Vite generates routeTree.gen.ts before TypeScript consumes it.
      - run: pnpm build
      - run: pnpm check-types

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axioma/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: axioma/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check-types

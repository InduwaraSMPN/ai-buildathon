# Static SPA server. The image is unprivileged nginx, which listens on 8080 as
# uid 101 — nothing here needs root.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets, so those are immutable. The
    # shell and its runtime configuration are not: a warm browser must pick up
    # a redeploy that only changed the API URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Container liveness. Deliberately not /health, which is the API's path and
    # would read as a proxied backend check.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Every unrecognised path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

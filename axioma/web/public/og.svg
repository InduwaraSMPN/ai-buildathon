<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
<title id="og-title">Axiōma — from symptom to resolution</title>
<desc id="og-desc">AI IT support, one accountable loop from ticket to action</desc>
<!-- Background: paper/veil -->
<rect width="1200" height="630" fill="#f4f4f5"/>
<!-- Outer frame / page-sheet hint -->
<rect x="24" y="24" width="1152" height="582" rx="28" fill="#ffffff" stroke="#e4e4e7" stroke-opacity="0.9"/>
<!-- Top ledger rule + brand accent -->
<rect x="72" y="72" width="64" height="4" rx="2" fill="#008236"/>
<rect x="72" y="96" width="1056" height="1" fill="#09090b" opacity="0.08"/>
<!-- Eyebrow -->
<text x="72" y="146" font-family="Geist Mono Variable, Geist Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.14em" fill="#71717a" font-weight="600">AI IT SUPPORT / ONE ACCOUNTABLE LOOP</text>
<!-- Wordmark: Axiōma -->
<text x="72" y="256" font-family="Instrument Sans Variable, Instrument Sans, system-ui, sans-serif" font-size="96" letter-spacing="-0.045em" fill="#09090b" font-weight="700">Axiōma</text>
<!-- Subtitle -->
<text x="72" y="332" font-family="Instrument Sans Variable, Instrument Sans, system-ui, sans-serif" font-size="40" letter-spacing="-0.03em" fill="#09090b" font-weight="700">from symptom <tspan fill="#008236" font-style="italic">to resolution.</tspan></text>
<!-- Lede -->
<text x="72" y="388" font-family="Instrument Sans Variable, Instrument Sans, system-ui, sans-serif" font-size="22" fill="#52525b" font-weight="400">Gives Axel the context and tools to carry a ticket</text>
<text x="72" y="420" font-family="Instrument Sans Variable, Instrument Sans, system-ui, sans-serif" font-size="22" fill="#52525b" font-weight="400">from report to verified fix — or a clear handoff.</text>
<!-- Bottom meta rule -->
<rect x="72" y="484" width="1056" height="1" fill="#09090b" opacity="0.08"/>
<text x="72" y="522" font-family="Geist Mono Variable, Geist Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.08em" fill="#71717a">AXIOMA.DEV</text>
<text x="72" y="546" font-family="Geist Mono Variable, Geist Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.08em" fill="#71717a">TICKET → EVIDENCE → ACTION → OUTCOME</text>
<!-- Small dossier mark hint bottom-right -->
<g opacity="0.10">
<rect x="1028" y="494" width="100" height="64" rx="14" fill="none" stroke="#09090b" stroke-width="1.2"/>
<line x1="1044" y1="520" x2="1112" y2="520" stroke="#09090b" stroke-width="1.2" stroke-linecap="round"/>
<line x1="1044" y1="536" x2="1096" y2="536" stroke="#09090b" stroke-width="1.2" stroke-linecap="round"/>
</g>
</svg>

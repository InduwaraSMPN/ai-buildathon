<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Axiōma — verified IT support</title>
  <desc id="desc">Fixes the ticket. Verifies the fix. Or escalates with the evidence.</desc>
  <rect width="1200" height="630" fill="#f4f4f5"/>
  <rect x="44" y="44" width="1112" height="542" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <text x="92" y="140" font-family="Instrument Sans Variable, Instrument Sans, sans-serif" font-size="34" font-weight="600" fill="#09090b">Axiōma</text>
  <text x="92" y="254" font-family="Instrument Sans Variable, Instrument Sans, sans-serif" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#09090b">Fixes the ticket.</text>
  <text x="92" y="326" font-family="Instrument Sans Variable, Instrument Sans, sans-serif" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#09090b">Verifies the fix.</text>
  <text x="92" y="398" font-family="Instrument Sans Variable, Instrument Sans, sans-serif" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#09090b">Or escalates with the evidence.</text>
  <rect x="92" y="478" width="126" height="42" rx="21" fill="none" stroke="#008236"/>
  <text x="116" y="505" font-family="Geist Mono Variable, Geist Mono, monospace" font-size="16" fill="#008236">resolved</text>
</svg>

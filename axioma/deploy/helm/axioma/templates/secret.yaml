{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.betterAuthSecret }}
{{- fail "secrets.betterAuthSecret is required and has no default. Generate one with at least 32 characters, or set secrets.existingSecret." }}
{{- end }}
{{- if lt (len .Values.secrets.betterAuthSecret) 32 }}
{{- fail "secrets.betterAuthSecret must be at least 32 characters; the API rejects anything shorter at startup." }}
{{- end }}
{{/*
Checked here because the API only checks it at import: a key of the wrong
length crash-loops the pod with no clue in the events, and `helm template`
would happily render it. Generate one with `openssl rand -base64 32`.
*/}}
{{- with .Values.secrets.providerEncryptionKey }}
{{- if ne (len (b64dec .)) 32 }}
{{- fail (printf "secrets.providerEncryptionKey must be base64 for exactly 32 bytes; this one decodes to %d. Generate one with: openssl rand -base64 32" (len (b64dec .))) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axioma.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axioma.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Composed from the bundled Postgres unless secrets.databaseUrl overrides it.
  DATABASE_URL: {{ include "axioma.databaseUrl" . | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
  {{- with .Values.secrets.providerEncryptionKey }}
  AXIOMA_PROVIDER_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.llmKey }}
  AXIOMA_LLM_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.embeddingKey }}
  AXIOMA_EMBEDDING_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mailOutboundToken }}
  AXIOMA_MAIL_OUTBOUND_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mailInboundToken }}
  AXIOMA_MAIL_INBOUND_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.directorySourceToken }}
  AXIOMA_DIRECTORY_SOURCE_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}

{{- if not .Values.api.grpc.tls.existingSecret }}
{{- if not .Values.api.grpc.tls.generate }}
{{- fail "The gRPC gateway requires TLS and the API refuses to start without it. Either set api.grpc.tls.existingSecret to a kubernetes.io/tls Secret, or leave api.grpc.tls.generate true." }}
{{- end }}
{{/*
A self-signed certificate for the gRPC gateway, generated once and then reused.

`lookup` reads the Secret this chart wrote on the previous release, so an
upgrade keeps the same certificate; regenerating on every upgrade would break
every enrolled device that had been given the old one to trust. During
`helm template` there is no cluster to look up, so a throwaway certificate is
rendered instead — that output is for reading, not for applying.

Self-signed means the certificate is its own trust anchor. Devices and the
agent must be given it; see ../../README.md for how to extract it.
*/}}
{{- $name := printf "%s-grpc-tls" (include "axioma.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data (index (default dict $existing.data) "tls.crt") }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $sans := include "axioma.api.grpcTlsSans" . | fromYamlArray }}
{{- $generated := genSelfSignedCert (first $sans) nil $sans (int .Values.api.grpc.tls.validityDays) }}
{{- $crt = b64enc $generated.Cert }}
{{- $key = b64enc $generated.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axioma.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    # Rotating means deleting this Secret and upgrading; every enrolled device
    # then has to be given the new certificate.
    axioma.io/generated-sans: {{ include "axioma.api.grpcTlsSans" . | fromYamlArray | join "," | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}

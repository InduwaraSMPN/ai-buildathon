syntax = "proto3";

package axioma.v1;

option go_package = "github.com/axioma/cli/internal/pb;pb";

// Axiōma cross-language contract.
//
// Two boundaries live here, and both work the same way: the remote side dials in and
// holds one bidirectional stream, and the API pushes work down it. Neither the
// agent nor a device can be dialled directly — one is behind whatever network
// the worker runs on, the other is behind NAT on an employee's laptop.
//
// Portal and dashboard talk to the API through oRPC, where the contract is the
// TypeScript definition itself and inference runs end to end — they do not use
// this file. The TypeScript API gateway loads this protobuf definition at
// runtime (src/server/grpc.ts via @grpc/proto-loader loadSync and
// grpc.loadPackageDefinition, resolving proto/axioma.proto) and serves both
// channels from it. Python (agent) and Go (CLI/device) require it as the
// cross-language wire format where a language boundary forces an explicit
// schema.

// ---------------------------------------------------------------------------
// Agent back-channel: API <-> Python agent
// ---------------------------------------------------------------------------

service AgentChannel {
  // The agent is the client. It dials the API and holds the stream open.
  rpc Connect(stream AgentMessage) returns (stream ApiMessage);
}

message AgentMessage {
  oneof payload {
    AgentHello hello = 1;
    RunUpdate run_update = 2;
    ToolRequest tool_request = 3;
    Heartbeat heartbeat = 4;
    RunAccepted run_accepted = 5;
  }
}

message RunAccepted {
  string run_id = 1;
}

message ApiMessage {
  oneof payload {
    StartRun start_run = 1;
    ToolResult tool_result = 2;
    CancelRun cancel_run = 3;
    Heartbeat heartbeat = 4;
    TerminalAck terminal_ack = 5;
  }
}

message TerminalAck {
  string run_id = 1;
  uint32 ordinal = 2;
}

message AgentHello {
  string agent_version = 1;
  // Model actually backing Axel for this worker, observed rather than configured.
  string model_label = 2;
  repeated string capabilities = 3;
  string worker_id = 4;
}

message StartRun {
  string run_id = 1;
  string ticket_id = 2;
  string title = 3;
  string body = 4;
  string reporter_id = 5;
  // Empty when the ticket is not about a specific machine.
  string device_id = 6;
  // Prior CMDB observations relevant to this ticket, as JSON.
  string context_json = 7;
  string record_type = 8;
  string impact = 9;
  string urgency = 10;
  string priority = 11;
  // Ticket ingestion provenance (for example portal, employee_email, monitoring).
  string origin = 12;
  // Server-resolved target environment. The agent may not infer this from ticket prose.
  string environment = 13;
  string reporter_name = 14;
  string reporter_job_title = 15;
  string reporter_department = 16;
  string reporter_manager = 17;
}

message CancelRun {
  string run_id = 1;
  string reason = 2;
}

// One step of the transcript. Sent as it happens, not batched at the end, so a
// run that hangs still shows how far it got.
message RunUpdate {
  string run_id = 1;
  uint32 ordinal = 2;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_THINK = 1;
    KIND_TOOL_CALL = 2;
    KIND_OBSERVATION = 3;
    KIND_DECISION = 4;
    KIND_TERMINAL = 5;
  }
  Kind kind = 3;

  string reasoning = 4;
  string tool_name = 5;
  string tool_input_json = 6;
  string tool_output_json = 7;
  string error = 8;

  // Set only on KIND_TERMINAL.
  string status = 9;   // resolved | escalated | failed | exhausted
  string outcome = 10;
  string evidence = 11;
  uint32 prompt_tokens = 12;
  uint32 completion_tokens = 13;
  string model = 14;
  string resolution_code = 15; // resolved terminals only

  // Informational messages that are not failures (e.g. transient provider
  // retries). Empty means absent.
  string notice = 16;
  // Presentation tone for the evidence alert:
  // success | warning | destructive | neutral
  string evidence_tone = 17;
}

// The agent asks the API to execute a tool. The agent never touches the
// database, the cluster, or a device directly — the API owns every side effect
// and every persistence path.
message ToolRequest {
  string run_id = 1;
  string call_id = 2;
  string tool_name = 3;
  string input_json = 4;
  uint32 source_step_ordinal = 5;
}

message ToolResult {
  string run_id = 1;
  string call_id = 2;
  bool ok = 3;
  string output_json = 4;
  string error = 5;
}

message Heartbeat {
  int64 unix_ms = 1;
}

// ---------------------------------------------------------------------------
// Device channel: API <-> Go device agent
// ---------------------------------------------------------------------------

service DeviceChannel {
  // The device is the client. Outbound only: it works through NAT, on home
  // networks, and behind corporate proxies without a firewall change.
  rpc Connect(stream DeviceMessage) returns (stream GatewayMessage);
}

message DeviceMessage {
  oneof payload {
    DeviceHello hello = 1;
    CommandResult result = 2;
    Heartbeat heartbeat = 3;
    InventoryReport inventory = 4;
  }
}

message InventoryReport {
  string report_id = 1;
  int64 collected_unix_ms = 2;
  string inventory_json = 3;
}

message GatewayMessage {
  oneof payload {
    DeviceCommand command = 1;
    Heartbeat heartbeat = 2;
    DeviceEnrollment enrollment = 3;
  }
}

message DeviceEnrollment {
  bool claimed = 1;
  bool code_expired = 2;
  // Returned once after enrolment, or pushed to an online device during rotation.
  string credential = 3;
  bool auth_valid = 4;
}

message DeviceHello {
  // UUID minted on first run and persisted to the user profile. Survives
  // restarts and network roaming; dies with the profile, which is the right
  // lifetime for "this person's laptop".
  string device_id = 1;
  string hostname = 2;
  string username = 3;
  string platform = 4;
  string release = 5;
  string agent_version = 6;
  // Last sequence the device processed. The gateway replays past it, because a
  // laptop that slept never got to acknowledge anything.
  uint64 last_seen_sequence = 7;
  // A short-lived, single-use token is presented only for first enrolment.
  string enrolment_token = 8;
  // Long-lived bearer credential bound to this device UUID.
  string credential = 9;
}

// Canonical fixed action vocabulary. DeviceCommand.action stays a string for wire
// compatibility; parity tests keep dispatch implementations aligned with this enum.
enum DeviceAction {
  DEVICE_ACTION_UNSPECIFIED = 0;
  DEVICE_ACTION_FLUSH_DNS = 1;
  DEVICE_ACTION_RENEW_DHCP_LEASE = 2;
  DEVICE_ACTION_CLEAR_PROXY_OVERRIDE = 3;
  DEVICE_ACTION_RESET_CREDENTIAL_CACHE = 4;
  DEVICE_ACTION_RESTART_USER_PROCESS = 5;
  DEVICE_ACTION_DISABLE_PROXY = 6;
  DEVICE_ACTION_REFRESH_CERTIFICATE_STORE = 7;
  DEVICE_ACTION_CLEAR_TEMP_FILES = 8;
  DEVICE_ACTION_CLEAR_OUTLOOK_CACHE = 9;
  DEVICE_ACTION_CLEAR_TEAMS_CACHE = 10;
  DEVICE_ACTION_CLEAR_ICON_CACHE = 11;
  DEVICE_ACTION_CLEAR_PRINT_QUEUE = 12;
  DEVICE_ACTION_GUI_INVOKE_CONTROL = 13;
  DEVICE_ACTION_GUI_SET_CONTROL_VALUE = 14;
  DEVICE_ACTION_GUI_TOGGLE_CONTROL = 15;
  DEVICE_ACTION_GUI_SELECT_ITEM = 16;
  DEVICE_ACTION_GUI_EXPAND_CONTROL = 17;
  // Dispatched by the API from an approved proposal, never selected by the
  // model. It is absent from the agent and API action enums on purpose.
  DEVICE_ACTION_RUN_COMMAND = 18;
}

// Canonical fixed facet vocabulary — the observable state each action is verified
// against. DeviceCommand.parameters["facets"] stays a JSON string for wire
// compatibility; parity tests keep facet implementations aligned with this enum.
enum DeviceFacet {
  DEVICE_FACET_UNSPECIFIED = 0;
  DEVICE_FACET_RESOLVER = 1;
  DEVICE_FACET_ADAPTERS = 2;
  DEVICE_FACET_REACHABILITY = 3;
  DEVICE_FACET_PROXY = 4;
  DEVICE_FACET_IDENTITY = 5;
  DEVICE_FACET_PROCESSES = 6;
  DEVICE_FACET_CERTIFICATES = 7;
  DEVICE_FACET_STORAGE = 8;
  DEVICE_FACET_APP_CACHE = 9;
  DEVICE_FACET_PRINTING = 10;
  DEVICE_FACET_SCREEN = 11;
}

message DeviceCommand {
  string command_id = 1;
  uint64 sequence = 2;

  // Tier one: a named action from a fixed set the device implements. No command
  // string ever crosses this boundary.
  string action = 3;
  map<string, string> parameters = 4;

  // The pixel fallback, for a surface with no accessibility tree. GUI
  // remediation itself is tier one shaped: the gui_* actions above drive UI
  // Automation and need nothing installed. Absent means the device cannot
  // serve this request, and it is currently absent everywhere.
  bool computer_use = 5;
  string objective = 6;

  uint32 timeout_seconds = 7;
}

message CommandResult {
  string command_id = 1;
  uint64 sequence = 2;
  bool ok = 3;
  string output_json = 4;
  string error = 5;

  // Terminal status when the boolean cannot express it. A replayed sequence is
  // acknowledged without re-running the command, so the device knows only that
  // it once accepted the sequence — not whether the work succeeded. Left empty
  // for ordinary results, where the API derives the status from `ok`. Values
  // come from COMMAND_STATUSES in api/src/shared.
  string status = 6;
}

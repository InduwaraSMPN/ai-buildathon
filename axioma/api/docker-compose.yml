name: axioma

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: axioma-postgres
    environment:
      POSTGRES_DB: axioma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      # Loopback only. Two scripts hardcode this DSN as their fallback, so the
      # weak development password is load-bearing; published on all interfaces
      # it made the database reachable from the rest of the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - axioma_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  axioma_postgres_data:

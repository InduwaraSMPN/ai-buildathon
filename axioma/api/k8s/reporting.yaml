apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: reporting }
  template:
    metadata:
      labels: { app: reporting }
    spec:
      containers:
        - name: reporting
          image: nginx:stable
          resources:
            requests:
              cpu: "64"
